<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1F33">
<title>Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --room:#EEEAF2; --surface:#FAF8FC; --ink:#231B2B; --ink-soft:#62586D; --line:#D6CFDE;
  --scrim:rgba(238,234,242,.86);
  --lane:rgba(35,27,43,.07); --lane-c:rgba(142,36,54,.24);
  --bar:#CD9B3F; --bar-black:#9E7428; --bar-next:#E8B04A; --bar-text:#2B1E0B;
  --bar-left:#7C9BE0; --bar-left-black:#5476C4; --bar-left-next:#9DB8F4;
  --miss:#B8394B; --felt-ink:#8E2436; --brass-ink:#A87618;
  --lacquer:#2A1F33; --lacquer-2:#3B2D48; --cab-ink:#F2ECF6; --cab-ink-soft:#C3B6CF;
  --felt:#8E2436; --ivory:#FBF8F2; --ebony:#1E1A22; --brass:#D6A548; --ok:#2E8C80; --bad:#B8394B;
  color-scheme:light;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --room:#1A1520; --surface:#251E2D; --ink:#EFE9F4; --ink-soft:#AA9FB6; --line:#3B3246;
    --scrim:rgba(26,21,32,.88);
    --lane:rgba(239,233,244,.06); --lane-c:rgba(226,140,153,.30);
    --bar:#C8963A; --bar-black:#A07630; --bar-next:#F0BA55;
    --bar-left:#7593D8; --bar-left-black:#5A79C2; --bar-left-next:#A3BBF3;
    --felt-ink:#E28C99; --brass-ink:#E2B25A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --room:#1A1520; --surface:#251E2D; --ink:#EFE9F4; --ink-soft:#AA9FB6; --line:#3B3246;
  --scrim:rgba(26,21,32,.88);
  --lane:rgba(239,233,244,.06); --lane-c:rgba(226,140,153,.30);
  --bar:#C8963A; --bar-black:#A07630; --bar-next:#F0BA55;
  --bar-left:#7593D8; --bar-left-black:#5A79C2; --bar-left-next:#A3BBF3;
  --felt-ink:#E28C99; --brass-ink:#E2B25A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;background:var(--lacquer);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--room);color:var(--ink);
  font:400 16px/1.45 "Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}

/* Cabecera */
.cab{flex:none;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;background:var(--lacquer);color:var(--cab-ink)}
.brand{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.4rem;margin-right:auto;letter-spacing:.01em}
.tabs{display:flex;background:var(--lacquer-2);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:var(--cab-ink-soft);padding:0 14px;min-height:36px;border-radius:999px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brass);color:#2A1D0C}
.icon-btn{border:0;background:transparent;color:var(--cab-ink);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--lacquer-2)}

main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-soft)}
.btn.icon{width:40px;padding:0}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--room);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#FFF5F2}
.btn.primary:hover{filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 11px;min-height:38px;cursor:pointer;font-weight:500;color:var(--ink-soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--room)}

/* Tocar libre */
.display{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 16px 4px;text-align:center;overflow:hidden}
.big{font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(2.8rem,13vmin,7.5rem);line-height:1.02;color:var(--ink)}
.big.long{font-size:clamp(2rem,8vmin,4.4rem)}
.big.idle{font-size:clamp(1.9rem,7vmin,3.4rem);color:var(--ink-soft)}
.sub{color:var(--ink-soft);min-height:1.45em;max-width:46ch}
.staff{flex:0 1 150px;min-height:0;width:100%;max-width:280px;margin-top:6px}
.staff .sl{stroke:var(--ink-soft);stroke-width:1.1}
.staff .nh{fill:var(--ink)}
.staff .acc{fill:var(--ink);font-size:17px;font-family:"Alegreya Sans",sans-serif}
.staff .clef{fill:var(--ink-soft);font:italic 500 12px "Alegreya",Georgia,serif}
.toolbar{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 10px}
.group{display:flex;align-items:center;gap:6px}
.range{min-width:96px;text-align:center;color:var(--ink-soft);font-size:.95rem}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.btn.recording{border-color:var(--bad);color:var(--bad)}
.btn.recording .rec-dot{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}

/* Aprender: listas */
.songlist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 16px 28px;-webkit-overflow-scrolling:touch}
.list-inner{max-width:640px;margin:0 auto}
.songlist h1{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.12;margin:0 0 12px}
.ltabs{margin-bottom:14px}
.lead{margin:0 0 8px;color:var(--ink-soft);max-width:58ch}
.lvl h2{font-size:1rem;font-weight:700;margin:22px 0 4px;color:var(--felt-ink)}
.song{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:12px 8px;border:0;border-bottom:1px solid var(--line);
  background:transparent;text-align:left;cursor:pointer}
.song:hover{background:var(--surface)}
.song .t{display:block;font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.18rem;line-height:1.2}
.song .o{display:block;font-size:.92rem;color:var(--ink-soft)}
.diff{display:flex;gap:3px;height:24px}
.diff i{width:8px;height:24px;border:1px solid var(--ink-soft);border-top:0;border-radius:0 0 3px 3px}
.diff i.on{background:var(--ink);border-color:var(--ink)}
.diff.d4 i{width:6px}
.lvpick{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 10px}
.lvpick .seg{max-width:100%}
.lvpick .seg button{padding:0 9px;font-size:.93rem;white-space:nowrap}
.card .lvpick p{margin:0;font-size:.92rem;color:var(--ink)}
.card.haslv{padding-top:12px;padding-bottom:0}
.card.haslv h2{margin-bottom:6px}
.card.haslv .actions{position:sticky;bottom:-14px;margin-top:0;padding:8px 0 12px;background:var(--surface);border-radius:0 0 18px 18px}
.btn.lv .diff{height:18px}
.btn.lv .diff i{width:5px;height:18px}
#impLevel{max-width:100%}
#impLevel button{padding:0 8px;font-size:.93rem;white-space:nowrap}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:.95rem;color:var(--ink-soft)}
.num.done{background:var(--ok);border-color:var(--ok);color:#fff}
.is-next .num{border-color:var(--felt);color:var(--felt-ink)}
.next-tag{font-size:.88rem;font-weight:700;color:var(--felt-ink)}
.stars{color:var(--brass-ink);letter-spacing:2px;white-space:nowrap}
.new{font-size:.88rem;color:var(--ink-soft)}
.path-prog{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.path-prog .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.path-prog .bar i{display:block;height:100%;background:var(--ok)}
.path-prog span{font-size:.9rem;color:var(--ink-soft);white-space:nowrap}
.song-row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.song-row .song{border-bottom:0;flex:1;min-width:0}
.song-row .song .t{overflow:hidden;text-overflow:ellipsis}
.del{margin:0 4px;color:var(--ink-soft)}
.del.armed{width:auto;padding:0 12px;border-color:var(--bad);color:var(--bad)}
.imp-row{margin:10px 0 6px;display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none}
.empty{color:var(--ink-soft);margin:14px 0 0;max-width:58ch}
.msg{color:var(--bad);font-weight:500;margin:8px 0 0}
.sync{margin:22px 0 0;font-size:.88rem;color:var(--ink-soft)}

/* Reproductor */
.player{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.pbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptitle{flex:1 1 130px;min-width:0}
.ptitle .name{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--felt)}
.pctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
#fall{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);background:var(--surface);border:1px solid var(--line);
  padding:3px 14px;border-radius:999px;font-weight:700;pointer-events:none;text-align:center}
.overlay{position:absolute;inset:0;display:flex;padding:14px;overflow:auto;background:var(--scrim)}
.card{margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;max-width:400px;width:100%;
  text-align:center;box-shadow:0 14px 34px rgba(20,10,30,.2)}
.card h2{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.5rem;line-height:1.15;margin:0 0 8px}
.card p{margin:0 0 10px;color:var(--ink-soft)}
.card .kicker{font-size:.9rem;font-weight:700;color:var(--felt-ink);margin-bottom:2px}
.card .goal{color:var(--ink);text-align:left}
.card .mode{font-size:.92rem}
.card .pct{font-size:1.15rem;color:var(--ink);font-weight:700;margin-bottom:4px}
.card .tip{color:var(--ink)}
.stars-big{font-size:2rem;letter-spacing:6px;color:var(--brass);line-height:1;margin-bottom:6px}
.stars-big .off{color:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

/* Teclado */
.board{flex:0 0 clamp(128px,36%,300px);background:var(--lacquer);display:flex;flex-direction:column;padding-bottom:8px}
.felt{flex:none;height:7px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 2px,transparent 2px 5px),var(--felt);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35)}
.keys{position:relative;flex:1 1 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.key{position:absolute;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.key.white{height:100%;z-index:1;padding-bottom:12px;border-left:1px solid rgba(40,28,50,.3);border-radius:0 0 7px 7px;
  background:linear-gradient(180deg,#EFE9DE 0%,var(--ivory) 10%,var(--ivory) 90%,#E9E2D4 100%);box-shadow:inset 0 -7px 0 rgba(70,48,20,.07)}
.key.white.first{border-left:0}
.key.black{height:61%;z-index:2;padding-bottom:7px;border-radius:0 0 5px 5px;
  background:linear-gradient(180deg,#100E13 0%,var(--ebony) 72%,#3C3444 93%,#17141B 100%);box-shadow:0 3px 4px rgba(0,0,0,.45)}
.key.white.down{background:linear-gradient(180deg,#E0D7C7,#EAE2D3);box-shadow:inset 0 -2px 0 rgba(70,48,20,.1)}
.key.black.down{background:linear-gradient(180deg,#0B090D,#2A2430);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.key.white.guide{background:linear-gradient(180deg,#F1D79A,#F7E6BD)}
.key.black.guide{background:linear-gradient(180deg,#86601F,var(--brass))}
.key.white.guide.lh{background:linear-gradient(180deg,#B3C7F2,#D5E0F8)}
.key.black.guide.lh{background:linear-gradient(180deg,#2E4C94,#5F82CF)}
.key.guide.wait{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.13) saturate(1.2)}}
.key.white.auto{background:linear-gradient(180deg,#E9C77E,#F3DCA6)}
.key.black.auto{background:linear-gradient(180deg,#86601F,#C79436)}
.key.white.ok{background:linear-gradient(180deg,#96CFC4,#C6E7E0)}
.key.black.ok{background:linear-gradient(180deg,#1C655B,var(--ok))}
.key.white.bad{background:linear-gradient(180deg,#E6A0AA,#F2CAD0)}
.key.black.bad{background:linear-gradient(180deg,#6A1523,var(--bad))}
.lbl{font-weight:700;font-size:clamp(10px,1.5vw,14px);color:#6A5C72;line-height:1;white-space:nowrap}
.kb{font-size:10px;line-height:1;color:#A89EAF}
.key.black .kb{color:#8D8496}
.dot{width:6px;height:6px;border-radius:50%;background:var(--felt)}

/* Diálogos */
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100% - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(10,5,20,.35)}
dialog::backdrop{background:rgba(20,12,28,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:18px;max-height:85vh;overflow:auto}
.dlg h2{font-family:"Alegreya",Georgia,serif;font-size:1.5rem;margin:0}
.field{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.flabel{font-weight:700}
.fhelp{margin:0;color:var(--ink-soft);font-size:.93rem}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.chk input{margin-top:4px}
input[type=range]{width:100%;accent-color:var(--felt)}
.txt{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--room)}
.parts{display:flex;flex-direction:column;gap:6px;width:100%}
.part{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.part input{margin-top:5px;accent-color:var(--felt)}
.part .pn{display:block;font-weight:700}
.part .pd{display:block;font-size:.9rem;color:var(--ink-soft)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .done{align-self:flex-end}


/* Retos */
.reto-item{padding:14px 0 16px;border-bottom:1px solid var(--line)}
.reto-item h2{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.25rem;line-height:1.2;margin:0 0 2px;color:var(--ink)}
.reto-item p{margin:0;color:var(--ink-soft);max-width:58ch}
.lvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lvbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-height:56px}
.lvbtn:hover{border-color:var(--ink-soft)}
.lvn{font-weight:700}
.rprompt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 16px;text-align:center}
.rq{font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(3rem,14vmin,7rem);line-height:1.02}
.rstaff{flex:0 1 170px;max-width:300px;min-height:0}
.rfb{color:var(--ink-soft);min-height:1.5em;max-width:40ch}
.rscore{font-weight:700;color:var(--ink-soft);white-space:nowrap}
.keys.nolabels .key:not(.c) .lbl{visibility:hidden}
/* Ejercicios guardados */
.num.ia{font-size:.75rem;letter-spacing:.02em}

@media (max-height:520px){
  .cab{padding-top:4px;padding-bottom:4px}
  .staff{display:none}
  .toolbar{padding-top:4px;padding-bottom:6px}
  .rstaff{flex-basis:120px}
  .ptitle{flex-basis:70px}
  #startOv{padding:8px}
  .card.haslv{max-width:660px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;padding:10px 14px}
  .card.haslv h2{flex:1 1 100%;font-size:1.25rem;margin:0}
  .card.haslv .lvpick{display:contents}
  .card.haslv .lvpick p{flex:1 1 100%;order:3}
  .card.haslv .mode{display:none}
  .card.haslv .actions{position:static;padding:0;margin:0}
}
@media (prefers-reduced-motion:reduce){
  .key.guide.wait,.btn.recording .rec-dot{animation:none}
}
</style>
</head>
<body>

<header class="cab">
  <div class="brand">Piano</div>
  <nav class="tabs" role="tablist" aria-label="Modo">
    <button class="tab" id="tabFree" role="tab" aria-selected="true">Tocar libre</button>
    <button class="tab" id="tabLearn" role="tab" aria-selected="false">Aprender</button>
  </nav>
  <button class="icon-btn" id="btnSettings" aria-label="Ajustes">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg>
  </button>
</header>

<main>
  <section class="view" id="viewFree">
    <div class="display">
      <div class="big idle" id="bigName">Toca una tecla</div>
      <div class="sub" id="subName"></div>
      <svg class="staff" id="staff" viewBox="0 0 220 130" aria-hidden="true"></svg>
    </div>
    <div class="toolbar">
      <div class="group">
        <button class="btn icon" id="octDown" aria-label="Bajar una octava">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="range" id="rangeLbl"></span>
        <button class="btn icon" id="octUp" aria-label="Subir una octava">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="group">
        <button class="btn" id="btnPedal" aria-pressed="false" title="Pedal: las notas siguen sonando al soltar la tecla">Pedal</button>
        <button class="btn" id="btnRec"></button>
        <button class="btn" id="btnPlayRec"></button>
      </div>
    </div>
  </section>

  <section class="view" id="viewLearn" hidden>
    <div class="songlist" id="songList"></div>
    <div class="player" id="player" hidden>
      <div class="pbar">
        <button class="btn icon" id="btnBack" aria-label="Volver a la lista">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="ptitle"><div class="name" id="pTitle"></div><div class="progress"><i id="pProg"></i></div></div>
        <div class="pctrl">
          <button class="btn icon lv" id="btnLevel" hidden></button>
          <div class="seg" id="modeSeg" role="group" aria-label="Modo de práctica">
            <button data-v="esperar">Esperar</button><button data-v="ritmo">Ritmo</button><button data-v="escuchar">Escuchar</button>
          </div>
          <div class="seg" id="speedSeg" role="group" aria-label="Velocidad">
            <button data-v="0.5">50%</button><button data-v="0.75">75%</button><button data-v="1">100%</button>
          </div>
          <button class="btn icon" id="btnRestart" aria-label="Empezar de nuevo">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');

/* ---------- Almacenamiento local ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const settings = Object.assign({labels:'es', volume:0.8, theme:'auto', midiMute:true, mode:'esperar', speed:1, learnTab:'ejercicios'}, store.get('piano:ajustes', {}));
if (!['ejercicios', 'retos', 'canciones'].includes(settings.learnTab)) settings.learnTab = 'ejercicios';
const saveSettings = () => store.set('piano:ajustes', settings);

/* ---------- Notas ---------- */
const PCN = {
  es:['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'],
  en:['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B']
};
const BLACK = new Set([1,3,6,8,10]);
const pc = m => ((m % 12) + 12) % 12;
const isBlack = m => BLACK.has(pc(m));
const freq = m => 440 * Math.pow(2, (m - 69) / 12);
const octave = m => Math.floor(m / 12) - 1;
const sys = () => settings.labels === 'en' ? 'en' : 'es';
const nameOf = m => PCN[sys()][pc(m)];
const altName = m => PCN[sys() === 'en' ? 'es' : 'en'][pc(m)];
const fullName = m => nameOf(m) + octave(m);
function toMidi(s){
  s = String(s || '').trim(); s = s.charAt(0).toUpperCase() + s.slice(1);
  const r = /^([A-G])([#b]?)(-?\d)$/.exec(s);
  if (!r) throw new Error('Nota inválida: ' + s);
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1]];
  return 12 * (parseInt(r[3], 10) + 1) + base + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0);
}

/* ---------- Ruta de ejercicios ----------
   Formato: NOTA[+NOTA]:DURACIÓN[:DEDO[+DEDO]]   R = silencio */

function parseVoice(str, hand, out){
  let t = 0;
  const s = String(str || '').trim();
  if (!s) return 0;
  for (const tok of s.split(/\s+/)){
    const [ns, d, fs] = tok.split(':');
    const dur = parseFloat(d);
    if (!(dur > 0) || dur > 16) throw new Error('Duración inválida: ' + tok);
    if (String(ns).toUpperCase() !== 'R'){
      const fingers = fs ? fs.split('+') : [];
      ns.split('+').forEach((nm, i) => {
        const midi = toMidi(nm);
        const f = parseInt(fingers[i], 10);
        out.push({midi, start: t, dur, finger: f >= 1 && f <= 5 ? f : 0, hand: hand === 'auto' ? (midi < 60 ? 'L' : 'R') : hand});
      });
    }
    t += dur;
  }
  return t;
}
function encodeNotes(notes){
  return notes.map(n => [n.midi, Math.round(n.start * 24), Math.max(1, Math.round(n.dur * 24)), n.hand === 'L' ? 1 : 0].join(':')).join(' ');
}
function decodeNotes(str){
  return String(str || '').trim().split(/\s+/).filter(Boolean).map(t => {
    const [m, s, d, h] = t.split(':').map(Number);
    return {midi: m, start: s / 24, dur: d / 24, finger: 0, hand: h === 1 ? 'L' : 'R'};
  }).filter(n => n.midi >= 21 && n.midi <= 108 && isFinite(n.start) && n.dur > 0);
}
function songData(s){
  if (s._cache) return s._cache;
  let out = [], len = 0;
  try {
    if (s.notas) out.push(...decodeNotes(s.notas));
    if (s.notes) len = Math.max(len, parseVoice(s.notes, s.hand || 'R', out));
    if (s.left) len = Math.max(len, parseVoice(s.left, 'L', out));
  } catch(e){ out = []; len = 0; }
  for (const n of out) len = Math.max(len, n.start + n.dur);
  out.sort((a, b) => a.start - b.start || a.midi - b.midi);
  s._cache = {notes: out, length: len};
  return s._cache;
}

const NIVELES = [null,

function songLevels(s){
  if (s._lv) return s._lv;
  const base = songData(s).notes;
  const beat = (s.bpm || 120) / 60;
  const win = Math.max(1 / 24, 0.04 * beat) + 1e-6;
  const gap = 0.45 * beat - 1e-6;
  const groups = arr => { const out = []; let g = null; for (const n of arr){ if (!g || n.start - g[0].start > win){ g = []; out.push(g); } g.push(n); } return out; };
  const clip = arr => { for (let i = 0; i < arr.length - 1; i++) arr[i].dur = Math.max(1 / 8, Math.min(arr[i].dur, arr[i + 1].start - arr[i].start)); return arr; };
  const mk = (n, hand) => ({midi: n.midi, start: n.start, dur: n.dur, finger: 0, hand});
  // La nota más aguda de cada momento es la melodía; se descartan los bajos sueltos que suenan entre ella.
  const top = groups(base).map(g => g.reduce((a, b) => b.midi > a.midi ? b : a));
  const melSrc = top.filter((n, i) => {
    if (n.midi >= 60) return true;
    let lo = 999;
    for (let j = i - 1; j >= 0 && n.start - top[j].start <= 2; j--) if (top[j].midi >= 60) lo = Math.min(lo, top[j].midi);
    for (let j = i + 1; j < top.length && top[j].start - n.start <= 2; j++) if (top[j].midi >= 60) lo = Math.min(lo, top[j].midi);
    return lo === 999 || n.midi > lo - 7;
  });
  const l2 = clip(melSrc.map(n => mk(n, 'R')));
  // Nivel 1: se quitan las notas muy seguidas y se conserva la más larga de cada grupo.
  const kept = [];
  for (const n of melSrc){
    const last = kept[kept.length - 1];
    if (!last || n.start - last.start >= gap) kept.push(n);
    else if (n.dur > last.dur * 1.5 && (kept.length < 2 || n.start - kept[kept.length - 2].start >= gap)) kept[kept.length - 1] = n;
  }
  const l1 = clip(kept.map(n => mk(n, 'R')));
  // Nivel 3: la melodía y una sola nota grave a la vez, sin notas muy seguidas.
  const used = new Set(melSrc);
  const bass = [];
  for (const g of groups(base.filter(n => n.midi < 60 && !used.has(n)))){
    const n = g.reduce((a, b) => b.midi < a.midi ? b : a);
    if (!bass.length || n.start - bass[bass.length - 1].start >= gap * 2) bass.push(mk(n, 'L'));
  }
  clip(bass);
  let k = 0;
  for (const b of bass){
    while (k < l2.length - 1 && l2[k + 1].start <= b.start + win) k++;
    for (const m of [l2[k], l2[k + 1]]) if (m && Math.abs(m.start - b.start) <= win){ b.start = m.start; break; }
  }
  const l3 = l2.map(n => Object.assign({}, n)).concat(bass).sort((a, b) => a.start - b.start || a.midi - b.midi);
  const l4 = base.map(n => Object.assign({}, n));
  const notes = [null, l1, l2, l3, l4];
  const avail = [];
  if (l1.length && l1.length < l2.length) avail.push(1);
  avail.push(2);
  if (l3.length > l2.length && l3.length < l4.length) avail.push(3);
  if (l4.length > l2.length) avail.push(4);
  s._lv = {notes, avail};
  return s._lv;
}
function pickLevel(avail, want){
  if (avail.includes(want)) return want;
  const lower = avail.filter(x => x < want);

}
const hasLevels = s => !!s && s.kind === 'midi';
function baseLevel(s){ const a = songLevels(s).avail; return a.includes(s.nivel) ? s.nivel : a[a.length - 1]; }

function hydrate(o){
  const base = {id: String(o.id), key: 'u:' + o.id, title: String(o.title || '').slice(0, 80) || 'Sin título',
                bpm: Math.max(30, Math.min(240, +o.bpm || 100)), created: +o.created || 0, user: true, localOnly: !!o.localOnly};
  if (o.kind === 'ejercicio') return Object.assign(base, {kind: 'ejercicio', goal: String(o.goal || '').slice(0, 400),
    notes: String(o.notes || ''), left: String(o.left || ''), tema: String(o.tema || ''), generated: true});
  return Object.assign(base, {kind: 'midi', notas: String(o.notas || ''), nivel: [1, 2, 3, 4].includes(+o.nivel) ? +o.nivel : 0, origin: 'Importada'});
}
function bodyOf(s){
  return s.kind === 'ejercicio'
    ? {kind: 'ejercicio', title: s.title, goal: s.goal, bpm: s.bpm, notes: s.notes, left: s.left, tema: s.tema, created: s.created}
    : Object.assign({kind: 'midi', title: s.title, bpm: s.bpm, notas: s.notas, created: s.created}, s.nivel ? {nivel: s.nivel} : {});
}
function mergeBest(a, b){
  const out = Object.assign({}, a);
  for (const [k, v] of Object.entries(b || {})){
    const p = out[k];
    if (!p || v.stars > p.stars || (v.stars === p.stars && v.pct > p.pct)) out[k] = v;
  }
  return out;
}
const Data = {
  mode: 'local', col: null, pref: null, q: Promise.resolve(),
  progress: store.get('piano:mejores', {}) || {},
  items: (store.get('piano:mis-canciones', []) || []).map(o => hydrate(Object.assign({}, o, {localOnly: true}))),
  saveLocal(){ store.set('piano:mis-canciones', this.items.filter(s => s.localOnly).map(s => Object.assign({id: s.id}, bodyOf(s)))); },
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const pref = db.doc('data/users/' + uid + '/progreso');
      const col = db.doc('data/users/' + uid + '/biblioteca').collection('canciones');
      const [snap, qs] = await Promise.all([pref.get(), col.get()]);
      const remote = (snap.exists && snap.data() && snap.data().mejores) || {};
      const merged = mergeBest(remote, this.progress);
      const cloud = qs.docs.map(d => hydrate(Object.assign({id: d.id}, d.data())));
      this.mode = 'cloud'; this.pref = pref; this.col = col;
      this.progress = merged; store.set('piano:mejores', merged);
      let dirty = JSON.stringify(merged) !== JSON.stringify(remote);
      for (const s of this.items.filter(x => x.localOnly)){
        try {
          const ref = col.doc();
          const body = bodyOf(s); body.created = body.created || Date.now();
          await ref.set(body);
          const hs = hydrate(Object.assign({id: ref.id}, body));
          for (const suf of ['', '~1', '~2', '~3', '~4']){
            if (this.progress[s.key + suf]){ this.progress[hs.key + suf] = this.progress[s.key + suf]; delete this.progress[s.key + suf]; dirty = true; }
          }
          if (settings.niveles && settings.niveles[s.key]){ settings.niveles[hs.key] = settings.niveles[s.key]; delete settings.niveles[s.key]; saveSettings(); }
          cloud.push(hs);
        } catch(e){ cloud.push(s); }
      }
      if (dirty) this.writeProgress();
      this.items = cloud.sort((a, b) => a.created - b.created);
      this.saveLocal();
      onDataChange();
    } catch(e){ /* sin cuenta: se sigue usando el navegador */ }
  },
  writeProgress(){
    if (this.mode !== 'cloud') return;
    const body = {mejores: JSON.parse(JSON.stringify(this.progress))};
    this.q = this.q.then(() => this.pref.set(body)).catch(() => {});
  },
  saveBest(key, stars, pct){
    const p = this.progress[key];
    if (p && (p.stars > stars || (p.stars === stars && p.pct >= pct))) return;
    this.progress[key] = {stars, pct};
    store.set('piano:mejores', this.progress);
    this.writeProgress();
  },
  async addItem(body){
    body = Object.assign({}, body, {created: Date.now()});
    if (this.mode === 'cloud'){
      try { const ref = this.col.doc(); await ref.set(body); const hs = hydrate(Object.assign({id: ref.id}, body)); this.items.push(hs); return hs; }
      catch(e){ /* se guarda en el navegador */ }
    }
    const hs = hydrate(Object.assign({id: 'l' + Date.now().toString(36), localOnly: true}, body));
    this.items.push(hs); this.saveLocal();
    return hs;
  },
  async deleteItem(id){
    const s = this.items.find(x => x.id === id); if (!s) return;
    this.items = this.items.filter(x => x !== s);
    for (const suf of ['', '~1', '~2', '~3', '~4']) delete this.progress[s.key + suf];
    store.set('piano:mejores', this.progress);
    if (settings.niveles && settings.niveles[s.key]){ delete settings.niveles[s.key]; saveSettings(); }
    this.saveLocal();
    if (this.mode === 'cloud' && !s.localOnly){ try { await this.col.doc(id).delete(); } catch(e){} this.writeProgress(); }
  }
};

let actx = null, master = null, pwave = null, pedal = false;

function audio(){

    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
    actx = new AC();

    comp.threshold.value = -14; comp.ratio.value = 4;
    master = actx.createGain(); master.gain.value = settings.volume;
    master.connect(comp); comp.connect(actx.destination);
    const amps = [0, 1, 0.62, 0.36, 0.25, 0.16, 0.11, 0.07, 0.05, 0.035, 0.025, 0.018];
    pwave = actx.createPeriodicWave(new Float32Array(amps.length), new Float32Array(amps));

  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2; o2.detune.value = 4;

  g.gain.setTargetAtTime(peak * 0.4, now + 0.006, 0.09);

  gp.setTargetAtTime(0, now, rel);
  try { v.o1.stop(now + rel * 8); v.o2.stop(now + rel * 8); } catch(e){}
}
function releaseVoice(m){
  const v = voices.get(m); if (!v) return;
  v.held = false;
  if (!pedal) stopVoice(m, m > 84 ? 0.15 : 0.09);
}
const pedalSrc = new Set();
function setPedal(src, on){
  if (on) pedalSrc.add(src); else pedalSrc.delete(src);
  pedal = pedalSrc.size > 0;
  $('#btnPedal').setAttribute('aria-pressed', pedal ? 'true' : 'false');
  if (!pedal) for (const [m, v] of [...voices]) if (!v.held) stopVoice(m, 0.12);
}

/* ---------- Teclado en pantalla ---------- */
const keysEl = $('#keys');
let keyEls = new Map();
let range = {lo: -1, hi: -1};
const KB_LOWER = ['KeyZ','KeyS','KeyX','KeyD','KeyC','KeyV','KeyG','KeyB','KeyH','KeyN','KeyJ','KeyM','Comma','KeyL','Period','Semicolon','Slash'];
const KB_UPPER = ['KeyQ','Digit2','KeyW','Digit3','KeyE','KeyR','Digit5','KeyT','Digit6','KeyY','Digit7','KeyU','KeyI','Digit9','KeyO','Digit0','KeyP'];
const CODE_LABEL = {Comma:',', Period:'.', Semicolon:'Ñ', Slash:'-'};
let kbBase = 60;
function codeToMidi(code){
  let i = KB_LOWER.indexOf(code); if (i >= 0) return kbBase + i;
  i = KB_UPPER.indexOf(code); if (i >= 0) return kbBase + 12 + i;
  return null;
}
function codeLabel(c){ return CODE_LABEL[c] || (c.startsWith('Key') ? c.slice(3) : c.startsWith('Digit') ? c.slice(5) : ''); }
function hintFor(m){
  const i = m - kbBase; if (i >= 0 && i < KB_LOWER.length) return codeLabel(KB_LOWER[i]);
  const j = m - kbBase - 12; if (j >= 0 && j < KB_UPPER.length) return codeLabel(KB_UPPER[j]);
  return '';
}
function countWhites(lo, hi){ let c = 0; for (let m = lo; m <= hi; m++) if (!isBlack(m)) c++; return c; }
function rangeEnd(lo, n){ let m = lo, c = 1; while (c < n && m < 108){ m++; if (!isBlack(m)) c++; } return m; }

function buildKeyboard(lo, hi){
  range = {lo, hi};
  keysEl.innerHTML = ''; keyEls = new Map();
  guideKey = ''; guideEls = [];
  kbBase = lo - pc(lo);
  const ww = 100 / countWhites(lo, hi);
  let wi = 0;
  for (let m = lo; m <= hi; m++){
    const el = document.createElement('div');
    el.dataset.m = m;
    if (isBlack(m)){
      el.className = 'key black';
      el.style.left = (wi * ww - ww * 0.3) + '%';
      el.style.width = (ww * 0.6) + '%';
    } else {
      el.className = 'key white' + (wi === 0 ? ' first' : '') + (pc(m) === 0 ? ' c' : '');
      el.style.left = (wi * ww) + '%';
      el.style.width = ww + '%';
      wi++;
    }
    if (fine){ const k = document.createElement('span'); k.className = 'kb'; k.textContent = hintFor(m); el.appendChild(k); }
    if (!isBlack(m)){
      const lb = document.createElement('span'); lb.className = 'lbl'; el.appendChild(lb);
      if (m === 60){ const d = document.createElement('span'); d.className = 'dot'; d.title = 'Do central'; el.appendChild(d); }
    }
    if ((down.get(m) || 0) > 0) el.classList.add('down');
    if (autoCount.has(m)) el.classList.add('auto');
    keysEl.appendChild(el);
    keyEls.set(m, el);
  }
  refreshLabels();
}
function refreshLabels(){
  for (const [m, el] of keyEls){
    if (isBlack(m)) continue;
    el.querySelector('.lbl').textContent = settings.labels === 'none' ? '' : (pc(m) === 0 ? fullName(m) : nameOf(m));
  }
}
function freeWhiteCount(){
  const w = keysEl.clientWidth || window.innerWidth;
  return Math.max(8, Math.min(36, Math.round(w / (fine ? 42 : 46))));
}

/* ---------- Entrada: toque, mouse, teclado del computador, MIDI ---------- */
const down = new Map();
function press(m, src, vel = 0.8){
  const c = (down.get(m) || 0) + 1; down.set(m, c);
  if (c === 1){
    keyEls.get(m)?.classList.add('down');
    if (!(src === 'midi' && settings.midiMute)) startVoice(m, vel);
  }
  onPress(m);
}
function release(m){
  const c = (down.get(m) || 0) - 1;
  if (c > 0){ down.set(m, c); return; }
  down.delete(m);
  keyEls.get(m)?.classList.remove('down');
  releaseVoice(m);
  onRelease(m);
}
const ptrs = new Map();
const heldCodes = new Map();
function releaseAll(){
  ptrs.clear(); heldCodes.clear();
  for (const m of [...down.keys()]){ down.set(m, 1); release(m); }
}
function keyAt(x, y){
  const el = document.elementFromPoint(x, y);
  const k = el && el.closest ? el.closest('.key') : null;
  return k && keysEl.contains(k) ? +k.dataset.m : null;
}
keysEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  const m = keyAt(e.clientX, e.clientY);
  ptrs.set(e.pointerId, m);
  if (m != null) press(m, 'ptr');
});
window.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const m = keyAt(e.clientX, e.clientY), cur = ptrs.get(e.pointerId);
  if (m !== cur){ if (cur != null) release(cur); if (m != null) press(m, 'ptr'); ptrs.set(e.pointerId, m); }
});
const ptrUp = e => {
  if (!ptrs.has(e.pointerId)) return;
  const m = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (m != null) release(m);
};
window.addEventListener('pointerup', ptrUp);
window.addEventListener('pointercancel', ptrUp);
keysEl.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('dialog[open]')) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT') return;
  if (e.code === 'Space' && tag !== 'BUTTON'){
    e.preventDefault();
    if (view === 'player') togglePlay();
    else if (view === 'reto'){ if (!$('#rStartOv').hidden) startReto(); }
    else setPedal('space', true);
    return;
  }
  const m = codeToMidi(e.code); if (m == null) return;
  e.preventDefault();
  heldCodes.set(e.code, m); press(m, 'kb');
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space'){ setPedal('space', false); return; }
  const m = heldCodes.get(e.code); if (m == null) return;
  heldCodes.delete(e.code); release(m);
});
window.addEventListener('blur', () => { releaseAll(); setPedal('space', false); });

function onPress(m){
  if (view === 'free'){
    lastNote = m; updateDisplay();
    if (rec.on) rec.events.push({t: performance.now() - rec.start, m, on: true});
  } else if (view === 'player') judge(m);
  else if (view === 'reto') judgeReto(m);
}
function onRelease(m){
  if (view === 'free'){
    updateDisplay();
    if (rec.on) rec.events.push({t: performance.now() - rec.start, m, on: false});
  }
}

const autoCount = new Map();
function autoKey(m, on){
  const c = (autoCount.get(m) || 0) + (on ? 1 : -1);
  if (c > 0) autoCount.set(m, c); else autoCount.delete(m);
  keyEls.get(m)?.classList.toggle('auto', c > 0);
}
function clearAuto(){

  autoCount.clear();
}

/* ---------- Tocar libre ---------- */
let view = 'free', lastNote = null, freeStart = null;
function freeRange(){
  const n = freeWhiteCount();
  if (freeStart == null) freeStart = n <= 14 ? 60 : n <= 28 ? 48 : 36;
  let hi = rangeEnd(freeStart, n);
  while (countWhites(freeStart, hi) < n && freeStart > 24){ freeStart -= 12; hi = rangeEnd(freeStart, n); }
  return {lo: freeStart, hi, n};
}
function buildFree(){
  const r = freeRange();
  if (r.lo !== range.lo || r.hi !== range.hi) buildKeyboard(r.lo, r.hi);
  $('#rangeLbl').textContent = `${fullName(r.lo)} a ${fullName(r.hi)}`;
  $('#octDown').disabled = r.lo <= 24;
  $('#octUp').disabled = countWhites(r.lo + 12, rangeEnd(r.lo + 12, r.n)) < r.n;
}
$('#octUp').onclick = () => { releaseAll(); freeStart += 12; buildFree(); };
$('#octDown').onclick = () => { releaseAll(); freeStart = Math.max(24, freeStart - 12); buildFree(); };
$('#btnPedal').onclick = () => setPedal('btn', !pedalSrc.has('btn'));

const CHORDS = [
  [[0,4,7],'mayor'],[[0,3,7],'menor'],[[0,3,6],'disminuido'],[[0,4,8],'aumentado'],
  [[0,5,7],'sus4'],[[0,2,7],'sus2'],[[0,4,7,10],'7'],[[0,4,7,11],'maj7'],[[0,3,7,10],'m7']
];
function detectChord(ms){
  const pcs = [...new Set(ms.map(pc))];
  if (pcs.length < 3) return null;
  const bass = pc(Math.min(...ms));
  let best = null;
  for (const r of pcs){
    const set = pcs.map(p => (p - r + 12) % 12).sort((a, b) => a - b);
    for (const [tpl, kind] of CHORDS){
      if (tpl.length === set.length && tpl.every((v, i) => v === set[i])){
        if (!best || r === bass) best = {r, kind};
      }
    }
  }
  if (!best) return null;
  const rn = nameOf(best.r);
  return {name: best.kind === '7' ? rn + '7' : best.kind === 'm7' ? rn + ' menor 7' : rn + ' ' + best.kind};
}
function updateDisplay(){
  if (view !== 'free') return;
  const held = [...down.keys()].sort((a, b) => a - b);
  const auto = [...autoCount.keys()].sort((a, b) => a - b);
  const notes = held.length ? held : auto.length ? auto : lastNote != null ? [lastNote] : [];
  const big = $('#bigName'), sub = $('#subName');
  if (!notes.length){
    big.textContent = 'Toca una tecla'; big.className = 'big idle';
    sub.textContent = fine
      ? 'Usa el mouse o el teclado del computador: la fila Z X C V son teclas blancas y S D G H J las negras.'
      : 'Toca con los dedos. Puedes presionar varias teclas a la vez.';
    drawStaff([]);
    return;
  }
  const chord = notes.length >= 3 ? detectChord(notes) : null;
  let text, subText;
  if (chord){ text = chord.name; subText = 'Acorde: ' + notes.map(nameOf).join(', '); }
  else if (notes.length === 1){ const m = notes[0]; text = nameOf(m); subText = `${altName(m)}${octave(m)}, ${Math.round(freq(m))} Hz`; }
  else { text = notes.slice(0, 4).map(nameOf).join(' '); subText = notes.length > 4 ? `${notes.length} notas` : ''; }
  big.textContent = text;
  big.className = 'big' + (text.length > 7 ? ' long' : '');
  sub.textContent = subText;
  drawStaff(notes);
}
const LETTER_STEP = [0,0,1,1,2,3,3,4,4,5,5,6];
const stepOf = m => LETTER_STEP[pc(m)] + 7 * octave(m);
function drawStaff(notes, svg){
  svg = svg || $('#staff');
  const treble = !notes.length || Math.min(...notes) >= 60;
  const bottom = treble ? 30 : 18;
  const Y = s => 85 - (s - bottom) * 5;
  let out = '';
  for (let i = 0; i < 5; i++){ const y = 85 - i * 10; out += `<line x1="6" x2="214" y1="${y}" y2="${y}" class="sl"/>`; }
  out += `<text x="8" y="32" class="clef">${treble ? 'Clave de sol' : 'Clave de fa'}</text>`;
  const X0 = 124; let prev = null, shifted = false;
  for (const m of [...notes].sort((a, b) => a - b)){
    const s = stepOf(m);
    if (s < bottom - 7 || s > bottom + 16) continue;
    for (let l = bottom - 2; l >= s; l -= 2) out += `<line x1="${X0 - 13}" x2="${X0 + 13}" y1="${Y(l)}" y2="${Y(l)}" class="sl"/>`;
    for (let l = bottom + 10; l <= s; l += 2) out += `<line x1="${X0 - 13}" x2="${X0 + 13}" y1="${Y(l)}" y2="${Y(l)}" class="sl"/>`;
    shifted = prev !== null && s - prev <= 1 && !shifted;
    const x = shifted ? X0 + 14 : X0, y = Y(s);
    if (isBlack(m)) out += `<text x="${x - 21}" y="${y + 6}" class="acc">♯</text>`;
    out += `<ellipse cx="${x}" cy="${y}" rx="7" ry="5.2" transform="rotate(-20 ${x} ${y})" class="nh"/>`;
    prev = s;
  }
  svg.innerHTML = out;
}

const ICON = {
  play: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>',
  stop: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
const rec = {on: false, start: 0, events: []};
let saved = store.get('piano:grabacion', null);
let recTick = 0, playTimers = [], playingRec = false;
function fmtTime(ms){ const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function updateRecUI(){
  const b = $('#btnRec'), p = $('#btnPlayRec');
  if (rec.on){ b.classList.add('recording'); b.innerHTML = `<span class="rec-dot"></span>Detener ${fmtTime(performance.now() - rec.start)}`; }
  else { b.classList.remove('recording'); b.innerHTML = '<span class="rec-dot"></span>Grabar'; }
  p.disabled = rec.on || !(saved && saved.events && saved.events.length);
  p.innerHTML = playingRec ? ICON.stop + 'Parar' : ICON.play + 'Escuchar';
}
function stopRec(){
  if (!rec.on) return;
  rec.on = false; clearInterval(recTick);
  const ev = rec.events;
  if (ev.length){
    const t0 = Math.max(0, ev[0].t - 150);
    saved = {events: ev.map(e => ({t: Math.round(e.t - t0), m: e.m, on: e.on})), len: ev[ev.length - 1].t - t0};
    store.set('piano:grabacion', saved);
  }
  updateRecUI();
}
function stopPlayback(){
  playTimers.forEach(clearTimeout); playTimers = [];
  if (playingRec){ playingRec = false; clearAuto(); updateDisplay(); }
  updateRecUI();
}
$('#btnRec').onclick = () => {
  if (rec.on){ stopRec(); return; }
  stopPlayback(); audio();
  rec.on = true; rec.start = performance.now(); rec.events = [];
  recTick = setInterval(updateRecUI, 250);
  updateRecUI();
};
$('#btnPlayRec').onclick = () => {
  if (playingRec){ stopPlayback(); return; }
  if (!saved || !saved.events.length) return;
  audio(); playingRec = true; updateRecUI();
  for (const ev of saved.events){
    playTimers.push(setTimeout(() => {
      if (ev.on){ startVoice(ev.m, 0.8); autoKey(ev.m, true); lastNote = ev.m; }
      else { autoKey(ev.m, false); if (!autoCount.has(ev.m)) releaseVoice(ev.m); }
      updateDisplay();
    }, ev.t));
  }
  playTimers.push(setTimeout(() => { playingRec = false; clearAuto(); updateRecUI(); updateDisplay(); }, (saved.len || 0) + 600));
};

function readVar(d, P){
  let v = 0, b, i = 0;
  do { b = d.getUint8(P.i++); v = (v * 128) + (b & 0x7f); } while ((b & 0x80) && ++i < 4);
  return v;
}
function parseMidiFile(buf){
  const d = new DataView(buf), P = {i: 0};
  const str4 = () => { let s = ''; for (let k = 0; k < 4; k++) s += String.fromCharCode(d.getUint8(P.i++)); return s; };

  else tpq = div || 480;

  for (let t = 0; t < ntrks && P.i + 8 <= d.byteLength; t++){
    const id = str4(), len = d.getUint32(P.i); P.i += 4;
    const end = Math.min(P.i + len, d.byteLength);
    if (id !== 'MTrk'){ P.i = end; continue; }
    let tick = 0, status = 0, name = '';
    const open = new Map(), trackNotes = [];
    while (P.i < end){
      tick += readVar(d, P);
      if (P.i >= end) break;
      let st = d.getUint8(P.i);
      if (st & 0x80){ P.i++; if (st < 0xF0) status = st; }
      else { if (!status) throw new Error('formato'); st = status; }
      if (st === 0xFF){
        const type = d.getUint8(P.i++), l = readVar(d, P);
        if (type === 0x51 && l === 3 && !tempo) tempo = (d.getUint8(P.i) << 16) | (d.getUint8(P.i + 1) << 8) | d.getUint8(P.i + 2);
        else if (type === 0x03 && !name){
          let s = ''; for (let k = 0; k < l && k < 60; k++) s += String.fromCharCode(d.getUint8(P.i + k));
          try { s = decodeURIComponent(escape(s)); } catch(e){}
          name = s.replace(/[\x00-\x1F\x7F]/g, '').trim();
        }
        P.i += l; continue;
      }
      if (st === 0xF0 || st === 0xF7){ const l = readVar(d, P); P.i += l; continue; }
      if (st > 0xF0) continue;
      const hi = st & 0xF0, ch = st & 0x0F;
      const a = d.getUint8(P.i++);
      const b = (hi === 0xC0 || hi === 0xD0) ? 0 : d.getUint8(P.i++);
      if (hi === 0x90 && b > 0){ const k = ch * 128 + a; if (!open.has(k)) open.set(k, []); open.get(k).push(tick); }
      else if (hi === 0x80 || (hi === 0x90 && b === 0)){
        const k = ch * 128 + a, s = open.get(k);
        if (s && s.length) trackNotes.push({ch, midi: a, t0: s.shift(), t1: tick});
      }
    }
    for (const [k, s] of open) for (const t0 of s) trackNotes.push({ch: k >> 7, midi: k & 127, t0, t1: Math.max(t0 + tpq / 2, tick)});
    for (const n of trackNotes){
      if (n.ch === 9) continue;
      const key = t + ':' + n.ch;
      if (!parts.has(key)) parts.set(key, {name, track: t, ch: n.ch, notes: []});
      parts.get(key).notes.push(n);
    }
    P.i = end;
  }
  const toBeats = secPerTick ? (tk => tk * secPerTick * 2) : (tk => tk / tpq);

    const notes = p.notes.map(n => ({midi: n.midi, start: toBeats(n.t0), dur: toBeats(n.t1 - n.t0)}));
    let lo = 127, hi = 0, sum = 0;
    for (const n of notes){ lo = Math.min(lo, n.midi); hi = Math.max(hi, n.midi); sum += n.midi; }
    return {name: p.name || `Pista ${p.track + 1}`, notes, count: notes.length, lo, hi, avg: sum / notes.length};
  });

  list.forEach(p => { seen[p.name] = (seen[p.name] || 0) + 1; });

  list.forEach(p => { if (seen[p.name] > 1){ idx[p.name] = (idx[p.name] || 0) + 1; p.name += ` (parte ${idx[p.name]})`; } });

}
const MAX_NOTAS = 4000;
function buildImported(parts){
  const q = x => Math.round(x * 24) / 24;
  let notes = [];
  for (const p of parts) for (const n of p.notes){
    if (n.midi >= 21 && n.midi <= 108) notes.push({midi: n.midi, start: q(n.start), dur: Math.max(1 / 8, q(n.dur))});
  }
  notes.sort((a, b) => a.start - b.start || b.midi - a.midi);
  const seen = new Set();
  notes = notes.filter(n => { const k = n.start + ':' + n.midi; if (seen.has(k)) return false; seen.add(k); return true; });
  if (!notes.length) return null;
  const t0 = notes[0].start;
  notes.forEach(n => { n.start = q(n.start - t0); n.hand = n.midi < 60 ? 'L' : 'R'; });
  notes.sort((a, b) => a.start - b.start || a.midi - b.midi);
  let truncated = false;
  if (notes.length > MAX_NOTAS){ notes = notes.slice(0, MAX_NOTAS); truncated = true; }
  let lo = 127, hi = 0;
  for (const n of notes){ lo = Math.min(lo, n.midi); hi = Math.max(hi, n.midi); }
  return {notes, truncated, lo, hi};
}
async function unzipMidi(buf){
  const d = new DataView(buf);
  let eocd = -1;
  for (let i = d.byteLength - 22; i >= Math.max(0, d.byteLength - 65557); i--) if (d.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('formato');
  const count = d.getUint16(eocd + 10, true);
  let p = d.getUint32(eocd + 16, true);
  for (let k = 0; k < count && p + 46 <= d.byteLength; k++){
    if (d.getUint32(p, true) !== 0x02014b50) break;
    const method = d.getUint16(p + 10, true), csize = d.getUint32(p + 20, true);
    const nlen = d.getUint16(p + 28, true), xlen = d.getUint16(p + 30, true), clen = d.getUint16(p + 32, true), off = d.getUint32(p + 42, true);
    let name = '';
    for (const c of new Uint8Array(buf, p + 46, nlen)) name += String.fromCharCode(c);
    try { name = decodeURIComponent(escape(name)); } catch(e){}
    p += 46 + nlen + xlen + clen;
    if (!/\.(mid|midi|kar)$/i.test(name) || /(^|\/)__MACOSX\//.test(name)) continue;
    const start = off + 30 + d.getUint16(off + 26, true) + d.getUint16(off + 28, true);
    const raw = new Uint8Array(buf, start, csize);
    const short = name.split('/').pop();
    if (method === 0) return {name: short, data: raw.slice().buffer};
    if (method === 8 && typeof DecompressionStream !== 'undefined'){
      const out = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return {name: short, data: out};
    }
    throw new Error('zip-metodo');
  }
  throw new Error('zip-sin-midi');
}

function rr(x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();

  if (!P) return;
  const ppb = Math.max(36, H / 5);
  const grp = new Set(P.mode !== 'escuchar' ? pendingGroup() : []);
  if (P.waiting){
    for (const n of grp){
      const k = geom.get(n.midi); if (!k) continue;
      const gr = g.createLinearGradient(0, H - 90, 0, H);
      const c = n.hand === 'L' ? '124,155,224' : '214,165,72';
      gr.addColorStop(0, `rgba(${c},0)`); gr.addColorStop(1, `rgba(${c},.38)`);
      g.fillStyle = gr; g.fillRect(k.x, H - 90, k.w, 90);
    }
  }

  for (const n of P.notes){
    const yb = H - (n.start - P.t) * ppb;
    if (yb < 0) break;
    const yt = yb - n.dur * ppb;
    if (yt > H) continue;
    const k = geom.get(n.midi); if (!k) continue;
    const pad = k.black ? 1 : Math.max(2, k.w * 0.08);

    const left = n.hand === 'L';

    if (n.finger && h >= 36 && w >= 14){
      const r = Math.min(8.5, w / 2 - 1.5), cx = x + w / 2, cy = top + r + 4;
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
      g.fillStyle = '#231B2B'; g.font = `700 ${fs}px "Alegreya Sans", sans-serif`;
      g.textBaseline = 'middle'; g.fillText(String(n.finger), cx, cy + 0.5); g.textBaseline = 'alphabetic';
    }
    if (h >= 18 && w >= 14){
      const label = n.finger && h < 36 ? String(n.finger) : settings.labels !== 'none' ? nameOf(n.midi) : '';
      if (label){ g.font = `700 ${fs}px "Alegreya Sans", sans-serif`; g.fillStyle = txt; g.fillText(label, x + w / 2, Math.min(top + h - 6, H - 6)); }
    }
  }
  if (P.playing && P.t < 0 && Math.ceil(-P.t) <= 3){
    g.fillStyle = COL.soft; g.globalAlpha = 0.55;
    g.font = `italic 500 ${Math.min(96, H * 0.4)}px "Alegreya", Georgia, serif`;
    g.textBaseline = 'middle'; g.fillText(String(Math.ceil(-P.t)), W / 2, H * 0.45);
    g.globalAlpha = 1; g.textBaseline = 'alphabetic';
  }
}
function frame(ts){
  raf = requestAnimationFrame(frame);
  if (!P) return;
  const dt = P.lastTs ? Math.min(0.05, (ts - P.lastTs) / 1000) : 0;
  P.lastTs = ts;
  if (P.playing && !P.finished) step(dt);
  draw();
}

/* ---------- Pestañas ---------- */
function setTabs(){
  $('#tabFree').setAttribute('aria-selected', view === 'free' ? 'true' : 'false');
  $('#tabLearn').setAttribute('aria-selected', view !== 'free' ? 'true' : 'false');
  $('#viewFree').hidden = view !== 'free';
  $('#viewLearn').hidden = view === 'free';
}
function goFree(){
  leavePlayer(); leaveReto(); releaseAll();
  view = 'free'; setTabs(); buildFree(); updateDisplay();
}
function goLearn(){
  leavePlayer(); leaveReto(); releaseAll(); stopRec(); stopPlayback();
  view = 'list'; setTabs();
  $('#player').hidden = true; $('#reto').hidden = true; $('#songList').hidden = false;
  renderList(); buildFree();
}
$('#tabFree').onclick = goFree;
$('#tabLearn').onclick = () => { if (view !== 'list') goLearn(); };

/* ---------- Ajustes ---------- */
const dlg = $('#dlg');
function applyTheme(){
  if (settings.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', settings.theme);
  readColors();
}
function syncSettingsUI(){
  for (const b of $('#lblSeg').children) b.setAttribute('aria-pressed', b.dataset.v === settings.labels ? 'true' : 'false');
  for (const b of $('#themeSeg').children) b.setAttribute('aria-pressed', b.dataset.v === settings.theme ? 'true' : 'false');
  $('#vol').value = settings.volume;
  $('#midiMute').checked = !!settings.midiMute;
}
$('#btnSettings').onclick = () => {
  if (P && P.playing){ P.playing = false; setPlayIcon(); updateGuide(); }
  syncSettingsUI(); dlg.showModal();
};
$('#dlgClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#lblSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  settings.labels = b.dataset.v; saveSettings(); syncSettingsUI(); refreshLabels();
  if (view === 'free'){ buildFree(); updateDisplay(); }
  guideKey = '*'; updateGuide();
});
$('#themeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  settings.theme = b.dataset.v; saveSettings(); syncSettingsUI(); applyTheme();
});
$('#vol').addEventListener('input', e => { settings.volume = +e.target.value; if (master) master.gain.value = settings.volume; saveSettings(); });
$('#midiMute').addEventListener('change', e => { settings.midiMute = e.target.checked; saveSettings(); });
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
if (darkMQ.addEventListener) darkMQ.addEventListener('change', readColors);

function onMidi(e){
  const [s, d1, d2] = e.data, cmd = s & 0xF0;
  if (cmd === 0x90 && d2 > 0) press(d1, 'midi', 0.35 + 0.65 * d2 / 127);
  else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)){ if (down.has(d1)) release(d1); }
  else if (cmd === 0xB0 && d1 === 64) setPedal('midi', d2 >= 64);
}
if (!navigator.requestMIDIAccess){
  $('#btnMidi').hidden = true; $('#midiMute').closest('label').hidden = true;
  $('#midiStatus').textContent = 'Este navegador no permite conectar teclados. En un computador, Chrome o Edge sí lo permiten.';
}
$('#btnMidi').onclick = () => {
  const st = $('#midiStatus');
  st.textContent = 'Buscando teclados…';
  let req;
  try { req = navigator.requestMIDIAccess(); } catch(err){ st.textContent = 'Esta página no tiene permiso para usar teclados MIDI. Abre la página directamente en Chrome o Edge.'; return; }
  req.then(acc => {
    const attach = () => {
      const names = [];
      acc.inputs.forEach(inp => { inp.onmidimessage = onMidi; names.push(inp.name || 'Teclado'); });
      st.textContent = names.length ? 'Conectado: ' + names.join(', ') + '.' : 'No se encontró ningún teclado. Conéctalo por USB y toca «Conectar teclado» otra vez.';
    };
    attach(); acc.onstatechange = attach;
  }).catch(() => { st.textContent = 'El navegador no dio permiso para usar teclados MIDI en esta página.'; });
};

/* ---------- Tamaño y visibilidad ---------- */
let rsT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    if (view === 'player' && P) buildSongKeyboard();
    else if (view === 'reto' && RT){ const [lo, hi] = retoRange(); if (lo !== range.lo || hi !== range.hi) buildKeyboard(lo, hi); }
    else buildFree();
  }, 120);
});
if (window.ResizeObserver){
  const ro = new ResizeObserver(() => { if (view === 'player') layoutGeom(); });
  ro.observe($('#stage')); ro.observe(keysEl);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ releaseAll(); if (P && P.playing){ P.playing = false; setPlayIcon(); updateGuide(); } }
});

/* ---------- Inicio ---------- */
applyTheme();
buildFree();
updateDisplay();
updateRecUI();
Data.init();
takePending();
window.addEventListener('pageshow', e => { if (e.persisted) takePending(); });
})();
</script>
